name: Frontend CI and AWS Amplify Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  deploy:
    name: Trigger AWS Amplify deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Amplify webhook
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          test -n "$AMPLIFY_WEBHOOK_URL"
          curl --fail --silent --show-error --request POST "$AMPLIFY_WEBHOOK_URL"
